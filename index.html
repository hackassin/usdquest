<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>USDQuest — Learn NVIDIA OpenUSD</title>

<!-- App icon + installable PWA -->
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#76b900" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="USDQuest" />
<style>
  :root{
    --green:#76b900;          /* NVIDIA green */
    --green-d:#5e9400;
    --green-l:#8fd400;
    --ink:#0b1418;
    --panel:#0f1c22;
    --panel-2:#14272f;
    --line:#1f3a44;
    --text:#e8f3ec;
    --muted:#8aa1a8;
    --gold:#ffc800;
    --red:#ff5a5f;
    --blue:#1cb0f6;
    --radius:18px;
    --shadow:0 6px 0 rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%, #163b1a 0%, var(--ink) 55%) fixed;
    color:var(--text);
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;cursor:pointer;border:none;outline:none}
  .app{max-width:680px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}

  /* ---------- Top bar ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;
    display:flex;align-items:center;gap:14px;
    padding:14px 18px;
    background:rgba(11,20,24,.82);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;letter-spacing:.3px}
  .logo .cube{font-size:22px}
  .logo b{color:var(--green-l)}
  .spacer{flex:1}
  .stat{display:flex;align-items:center;gap:6px;font-weight:800;font-size:15px;
        padding:6px 11px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line)}
  .stat.streak{color:var(--gold)}
  .stat.xp{color:var(--green-l)}
  .stat.hearts{color:var(--red)}
  .stat .ico{font-size:16px;line-height:1}

  /* ---------- Path ---------- */
  .scroll{flex:1;overflow-y:auto;padding:8px 18px 120px}
  .unit-head{
    margin:26px 0 6px;border-radius:var(--radius);
    padding:16px 20px;color:#06140a;font-weight:800;
    box-shadow:var(--shadow);
    display:flex;justify-content:space-between;align-items:center;
  }
  .unit-head h2{margin:0;font-size:17px}
  .unit-head p{margin:3px 0 0;font-size:13px;font-weight:600;opacity:.8}
  .unit-head .badge{font-size:12px;background:rgba(0,0,0,.18);padding:5px 10px;border-radius:999px}

  .nodes{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 0 4px}
  .node-wrap{position:relative;display:flex;flex-direction:column;align-items:center}
  .node{
    width:74px;height:66px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:30px;position:relative;transition:transform .08s ease;
    border:none;color:#fff;
  }
  .node:active{transform:translateY(2px)}
  .node .ring{position:absolute;inset:-7px;border-radius:50%;border:4px solid transparent}
  .node.done{background:var(--green);box-shadow:0 6px 0 var(--green-d)}
  .node.current{background:var(--green);box-shadow:0 6px 0 var(--green-d);animation:bob 1.6s ease-in-out infinite}
  .node.current .ring{border-color:rgba(143,212,0,.55)}
  .node.locked{background:#23343b;box-shadow:0 6px 0 #16242a;color:#42555d;cursor:not-allowed}
  .node.boss{background:linear-gradient(160deg,#ffc800,#ff9d00);box-shadow:0 6px 0 #b86b00;color:#3a2400}
  .node.boss.locked{background:#23343b;box-shadow:0 6px 0 #16242a;color:#42555d}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .node-label{font-size:12px;color:var(--muted);margin-top:6px;max-width:130px;text-align:center;font-weight:600}
  .start-bubble{
    position:absolute;top:-34px;background:#fff;color:var(--green-d);
    font-weight:800;font-size:12px;padding:5px 12px;border-radius:10px;white-space:nowrap;
    box-shadow:0 3px 0 rgba(0,0,0,.2)
  }
  .start-bubble:after{content:"";position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);
    border:7px solid transparent;border-top-color:#fff;border-bottom:0}
  .check{position:absolute;right:-2px;top:-2px;background:var(--gold);color:#3a2400;
    width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:900;border:3px solid var(--ink)}

  /* zig-zag offsets */
  .o0{transform:translateX(0)} .o1{transform:translateX(60px)} .o2{transform:translateX(95px)}
  .o3{transform:translateX(60px)} .o4{transform:translateX(0)} .o5{transform:translateX(-60px)}
  .o6{transform:translateX(-95px)} .o7{transform:translateX(-60px)}

  /* ---------- Lesson screen ---------- */
  .lesson{display:none;flex-direction:column;flex:1;padding:16px 18px 24px;min-height:100%}
  .lesson.active{display:flex}
  .l-top{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .quit{font-size:26px;color:var(--muted);background:none;line-height:1}
  .pbar{flex:1;height:16px;background:var(--panel-2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
  .pbar i{display:block;height:100%;background:var(--green);border-radius:999px;transition:width .3s ease;width:0}
  .l-hearts{display:flex;align-items:center;gap:5px;color:var(--red);font-weight:800}

  .q-kind{font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--green-l);font-weight:800;margin-bottom:8px}
  .q-text{font-size:23px;font-weight:800;line-height:1.3;margin:0 0 10px}
  .q-sub{color:var(--muted);font-size:14px;margin:0 0 20px;line-height:1.5}
  code,.code{font-family:'Cascadia Code',Consolas,monospace;background:#0a161b;border:1px solid var(--line);
    padding:2px 7px;border-radius:6px;color:var(--green-l);font-size:.92em}
  pre.code{display:block;padding:14px 16px;white-space:pre;overflow-x:auto;color:var(--text);margin:0 0 20px}
  pre.code .tok{color:var(--green-l)} pre.code .str{color:var(--gold)} pre.code .com{color:var(--muted)}

  .choices{display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
  .choice{
    text-align:left;background:var(--panel);border:2px solid var(--line);
    border-bottom-width:4px;border-radius:14px;padding:16px 18px;color:var(--text);
    font-size:16px;font-weight:600;transition:.05s;display:flex;gap:12px;align-items:center;
  }
  .choice .key{flex:none;width:26px;height:26px;border:2px solid var(--line);border-radius:7px;
    display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--muted)}
  .choice:hover{background:var(--panel-2)}
  .choice.sel{border-color:var(--blue);background:rgba(28,176,246,.12)}
  .choice.sel .key{border-color:var(--blue);color:var(--blue)}
  .choice.correct{border-color:var(--green);background:rgba(118,185,0,.16)}
  .choice.correct .key{border-color:var(--green);color:var(--green-l)}
  .choice.wrong{border-color:var(--red);background:rgba(255,90,95,.14)}
  .choice.wrong .key{border-color:var(--red);color:var(--red)}
  .choice.disabled{pointer-events:none;opacity:.55}

  .typed{width:100%;background:var(--panel);border:2px solid var(--line);border-bottom-width:4px;
    border-radius:14px;padding:16px 18px;color:var(--text);font-size:17px;font-weight:600;margin-bottom:14px}
  .typed:focus{border-color:var(--blue)}

  /* ---------- Footer / feedback ---------- */
  .foot{margin-top:auto;padding-top:14px}
  .btn{
    width:100%;padding:16px;border-radius:14px;font-weight:800;font-size:16px;letter-spacing:.4px;
    text-transform:uppercase;color:#06140a;background:var(--green);box-shadow:0 5px 0 var(--green-d);
    transition:.05s;
  }
  .btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--green-d)}
  .btn.ghost{background:var(--panel-2);color:var(--muted);box-shadow:0 5px 0 #0c171c;border:1px solid var(--line)}
  .btn:disabled{background:#2a3a41;color:#5c6e75;box-shadow:0 5px 0 #16242a;cursor:not-allowed}
  .btn.blue{background:var(--blue);box-shadow:0 5px 0 #1187c4;color:#04212f}

  .feedback{
    position:fixed;left:0;right:0;bottom:0;z-index:40;transform:translateY(110%);
    transition:transform .25s cubic-bezier(.2,.8,.2,1);
  }
  .feedback.show{transform:translateY(0)}
  .feedback .inner{max-width:680px;margin:0 auto;padding:18px 18px 26px}
  .feedback.ok{background:rgba(28,53,18,.97)}
  .feedback.no{background:rgba(58,18,20,.97)}
  .fb-title{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:900;margin-bottom:4px}
  .feedback.ok .fb-title{color:var(--green-l)}
  .feedback.no .fb-title{color:var(--red)}
  .fb-explain{font-size:14px;line-height:1.55;color:#d4e6da;margin:0 0 14px}
  .fb-explain b{color:#fff}

  /* ---------- Results ---------- */
  .results{display:none;flex-direction:column;align-items:center;justify-content:center;flex:1;
    text-align:center;padding:40px 24px}
  .results.active{display:flex}
  .results .big{font-size:64px;margin-bottom:6px;animation:pop .4s ease}
  @keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1)}}
  .results h1{font-size:26px;margin:0 0 4px}
  .results p{color:var(--muted);margin:0 0 26px}
  .rstats{display:flex;gap:14px;margin-bottom:30px;flex-wrap:wrap;justify-content:center}
  .rstat{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:14px 22px;min-width:104px}
  .rstat .v{font-size:24px;font-weight:900}
  .rstat .l{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-top:2px}
  .rstat.xp .v{color:var(--green-l)} .rstat.acc .v{color:var(--blue)} .rstat.time .v{color:var(--gold)}

  /* ---------- misc ---------- */
  .hidden{display:none!important}
  .toast{position:fixed;top:74px;left:50%;transform:translateX(-50%) translateY(-20px);
    background:var(--gold);color:#3a2400;font-weight:800;padding:10px 18px;border-radius:999px;
    opacity:0;transition:.3s;z-index:50;box-shadow:0 4px 12px rgba(0,0,0,.4);font-size:14px}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .footer-note{text-align:center;color:var(--muted);font-size:12px;padding:18px;line-height:1.5}
  .footer-note a{color:var(--green-l)}
  .reset{background:none;color:var(--muted);text-decoration:underline;font-size:12px}
  .empty-hearts{filter:grayscale(1);opacity:.3}

  /* ---------- User chip ---------- */
  .topbar{flex-wrap:nowrap}
  .logo{flex:none}
  .stat{flex:none;white-space:nowrap}
  .stat.user{color:var(--text);cursor:pointer;max-width:150px;min-width:0}
  .stat.user:hover{background:var(--line)}
  .stat.user #uname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:90px}

  /* ---------- Login screen ---------- */
  .login{display:none;flex:1;flex-direction:column;align-items:center;justify-content:center;
    padding:40px 24px;min-height:100%}
  .login.active{display:flex}
  .login .brand{font-size:46px;margin-bottom:8px}
  .login h1{margin:0 0 4px;font-size:26px}
  .login h1 b{color:var(--green-l)}
  .login .tag{color:var(--muted);margin:0 0 26px;text-align:center;font-size:14px;line-height:1.5}
  .login .card{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--radius);padding:22px 20px;box-shadow:var(--shadow)}
  .login label{display:block;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);
    font-weight:800;margin:0 0 6px}
  .login input{width:100%;background:var(--ink);border:2px solid var(--line);border-radius:12px;
    padding:13px 14px;color:var(--text);font-size:16px;font-weight:600;margin-bottom:16px}
  .login input:focus{border-color:var(--blue)}
  .login .row{display:flex;gap:10px}
  .login .row .btn{flex:1;padding:14px}
  .auth-msg{min-height:18px;color:var(--red);font-size:13px;font-weight:700;margin:2px 0 12px;text-align:center}
  .auth-msg.ok{color:var(--green-l)}
  .login .note{color:var(--muted);font-size:11px;line-height:1.5;text-align:center;margin:16px 0 0;max-width:360px}

  /* ---------- Practice section ---------- */
  .practice-wrap{display:flex;gap:12px;margin:6px 0 4px;flex-wrap:wrap}
  .pcard{flex:1;min-width:220px;border-radius:var(--radius);padding:16px 18px;border:2px solid var(--line);
    background:var(--panel);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
  .pcard.mistakes{border-color:#5a2d33;background:linear-gradient(160deg,#26171a,#14272f)}
  .pcard.quick{border-color:#2d4a5a;background:linear-gradient(160deg,#16242a,#14272f)}
  .pcard .ptitle{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px}
  .pcard .pdesc{color:var(--muted);font-size:13px;line-height:1.4;flex:1}
  .pcard .pbtn{padding:11px;border-radius:11px;font-weight:800;font-size:14px;text-transform:uppercase;
    letter-spacing:.4px;color:#06140a}
  .pcard.mistakes .pbtn{background:var(--red);box-shadow:0 4px 0 #b53b3f;color:#fff}
  .pcard.quick .pbtn{background:var(--blue);box-shadow:0 4px 0 #1187c4;color:#04212f}
  .pcard .pbtn:active{transform:translateY(2px)}
  .pcard .pbtn:disabled{background:#2a3a41;color:#5c6e75;box-shadow:0 4px 0 #16242a;cursor:not-allowed}
  .pcard .pcount{font-size:13px;font-weight:800}
  .pcard.mistakes .pcount{color:#ff8b8f}
  .section-label{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);
    font-weight:800;margin:18px 2px 2px}

  /* ---------- Bottom nav ---------- */
  .nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:680px;z-index:30;
    display:flex;background:rgba(11,20,24,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom)}
  .nav.hidden{display:none}
  .navbtn{flex:1;background:none;color:var(--muted);padding:9px 4px 11px;display:flex;flex-direction:column;
    align-items:center;gap:2px;font-size:11px;font-weight:800;letter-spacing:.3px}
  .navbtn span{font-size:21px;line-height:1;opacity:.6}
  .navbtn.active{color:var(--green-l)}
  .navbtn.active span{opacity:1}
  .empty-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;
    color:var(--muted);font-size:14px;line-height:1.55;text-align:center}
  .empty-card b{color:var(--green-l)}

  /* ---------- Leaderboard ---------- */
  .lbtabs{display:flex;gap:6px;margin:10px 0 4px;background:var(--panel-2);border:1px solid var(--line);
    border-radius:12px;padding:4px}
  .lbtab{flex:1;padding:10px;border-radius:9px;font-weight:800;font-size:13px;color:var(--muted);background:none}
  .lbtab.active{background:var(--green);color:#06140a}
  .board{display:flex;flex-direction:column;gap:8px}
  .board-row{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);
    border-radius:14px;padding:11px 14px}
  .board-row.me{border-color:var(--green);background:rgba(118,185,0,.12)}
  .board-row .medal{font-size:20px;width:30px;text-align:center;flex:none}
  .board-row .medal .rank{color:var(--muted);font-weight:800;font-size:15px}
  .board-row .who{flex:1;display:flex;flex-direction:column;line-height:1.25;min-width:0}
  .board-row .who b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .board-row .who span{font-size:12px;color:var(--muted)}
  .board-row .bxp{font-weight:800;color:var(--green-l);flex:none}

  /* ---------- Friends ---------- */
  .friend-row{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:10px 12px;margin-bottom:8px}
  .friend-row .who{flex:1;display:flex;flex-direction:column;line-height:1.25;min-width:0}
  .friend-row .who b{font-size:14px}
  .friend-row .who span{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .addfriend{display:flex;gap:8px;margin:4px 0 6px}
  .addfriend input{flex:1;min-width:0;background:var(--ink);border:2px solid var(--line);border-radius:11px;
    padding:11px 12px;color:var(--text);font-size:15px;font-weight:600}
  .addfriend input:focus{border-color:var(--blue)}
  .mini{padding:9px 14px;border-radius:10px;font-weight:800;font-size:13px;flex:none}
  .mini.add,.mini.ok{background:var(--green);color:#06140a}
  .mini.no{background:var(--panel-2);color:var(--muted);border:1px solid var(--line)}
  .frbtns{display:flex;gap:6px}

  /* ---------- Profile ---------- */
  .profile-head{display:flex;align-items:center;gap:14px;margin:10px 0 8px}
  .profile-head .avatar{width:60px;height:60px;border-radius:50%;flex:none;
    background:linear-gradient(160deg,var(--green),var(--green-d));
    display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:#06140a}
  .profile-head h2{margin:0;font-size:21px}
  .profile-head p{margin:2px 0 0;color:var(--muted);font-size:13px}
  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0 4px}
  .ptile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 6px;text-align:center}
  .ptile .pv{font-size:21px;font-weight:900;color:var(--green-l)}
  .ptile .pl{font-size:10.5px;color:var(--muted);margin-top:3px}
  .uprog{margin-bottom:10px}
  .uprog-top{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:4px}
  .uprog-top span:last-child{color:var(--muted)}
  .ubar{height:9px;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .ubar i{display:block;height:100%;border-radius:999px}
  .acct-actions{display:flex;flex-direction:column;gap:10px;align-items:flex-start;margin-top:8px}
  .reset.danger{color:var(--red)}

  /* ---------- Bonus-heart goal ---------- */
  .heart-goal{display:flex;align-items:center;gap:10px;margin:4px 0 10px;font-size:12px;color:var(--muted);font-weight:700}
  .hg-bar{flex:none;width:80px;height:8px;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .hg-bar i{display:block;height:100%;background:var(--red);border-radius:999px;transition:width .3s}

  /* ---------- Match the pairs ---------- */
  .pairs{display:flex;gap:10px}
  .pcol{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
  .pair{background:var(--panel);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;
    padding:15px 8px;color:var(--text);font-weight:600;font-size:14px;line-height:1.25;transition:.05s}
  .pair.sel{border-color:var(--blue);background:rgba(28,176,246,.14)}
  .pair.locked{border-color:var(--green);background:rgba(118,185,0,.16);opacity:.5;pointer-events:none}
  .pair.bad{border-color:var(--red);background:rgba(255,90,95,.16)}

  /* ---------- Study rows ---------- */
  .study-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);
    border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;color:var(--text)}
  .study-row .sr-ico{font-size:20px;flex:none}
  .study-row .sr-name{flex:1;font-weight:600;font-size:14px}
  .study-row .sr-tag{font-size:11px;color:var(--muted);background:var(--panel-2);border:1px solid var(--line);
    padding:3px 8px;border-radius:999px;flex:none}

  /* ---------- Notes modal ---------- */
  .notes-modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
    padding:22px;background:rgba(4,10,12,.72);backdrop-filter:blur(4px)}
  .notes-modal.show{display:flex}
  .notes-card{width:100%;max-width:440px;max-height:86vh;overflow-y:auto;background:var(--panel);
    border:1px solid var(--line);border-radius:var(--radius);padding:24px 22px;box-shadow:var(--shadow)}
  .notes-emoji{font-size:40px;text-align:center}
  .notes-card h2{margin:6px 0 14px;text-align:center;font-size:21px}
  .notes-card ul{margin:0 0 20px;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}

  const a=accounts[key];
  if(!a) return "No account with that username.";
  if(a.pass!==hashPass(pass||"")) return "Incorrect password.";
  return loginOk(key);
}
async function logout(){
  if(cloud){ try{ await flushPush(); await cloud.auth.signOut(); }catch(e){} }
  else { save(); localStorage.removeItem(SESSION_KEY); }
  currentUser=null; userDisplay="";
  showLogin();
}

/* ---- Cloud (Supabase) auth + sync ---- */
let pushTimer=null;
function schedulePush(){ clearTimeout(pushTimer); pushTimer=setTimeout(pushCloud, 900); }
async function pushCloud(){
  if(!cloud || !currentUser) return;
  try{ await cloud.from("progress").upsert({ user_id:currentUser, data:S, updated_at:new Date().toISOString() }); }
  catch(e){ console.warn("Cloud save failed:", e); }
  pushProfile(); // keep public leaderboard stats in sync
}
async function flushPush(){ clearTimeout(pushTimer); await pushCloud(); }

async function onCloudSignedIn(user){
  currentUser=user.id;
  userDisplay=(user.email||"learner").split("@")[0];
  let loaded=null;
  try{
    const {data}=await cloud.from("progress").select("data").eq("user_id",user.id).maybeSingle();
    if(data && data.data) loaded=data.data;
  }catch(e){ console.warn("Cloud load failed:", e); }
  if(loaded){ S={...defaultState(), ...loaded}; }
  else {
    try{ const c=JSON.parse(localStorage.getItem("usdquest_cache_"+user.id)); if(c) loaded=c; }catch(e){}
    S={...defaultState(), ...(loaded||{})};
    await pushCloud(); // create the user's row
  }
  if(!Array.isArray(S.mistakes)) S.mistakes=[];
  await ensureProfile(user);
  localStorage.setItem("usdquest_cache_"+user.id, JSON.stringify(S));
}
async function cloudSignUp(email,pass){
  const {data,error}=await cloud.auth.signUp({ email:(email||"").trim(), password:pass });
  if(error) return error.message;
  if(!data.session) return "Account created — check your email to confirm, then log in.";
  await onCloudSignedIn(data.user); return null;
}
async function cloudLogin(email,pass){
  const {data,error}=await cloud.auth.signInWithPassword({ email:(email||"").trim(), password:pass });
  if(error) return error.message;
  await onCloudSignedIn(data.user); return null;
}

/* ---- Public profile (for leaderboard & friend search) ---- */
let userHandle = "";   // unique @handle used socially
function sanitizeHandle(s){ return (s||"").trim().toLowerCase().replace(/[^a-z0-9_]/g,""); }

async function ensureProfile(user){
  try{
    const {data}=await cloud.from("profiles").select("username").eq("id",user.id).maybeSingle();
    if(data && data.username){ userHandle=data.username; pushProfile(); return; }
  }catch(e){ console.warn("profile lookup failed:", e); return; }
  let base=sanitizeHandle((user.email||"learner").split("@")[0]); if(base.length<3) base="usd"+base;
  for(let i=0;i<6;i++){
    const cand = i===0 ? base : base+Math.floor(1000+Math.random()*9000);
    try{
      const {error}=await cloud.from("profiles").insert({ id:user.id, username:cand, display_name:userDisplay,
        xp:S.xp, streak:S.streak, lessons:Object.keys(S.completed).length });
      if(!error){ userHandle=cand; return; }
      if(!/duplicate|unique|23505/i.test((error.message||"")+(error.code||""))){ console.warn("profile insert:", error); return; }
    }catch(e){ console.warn(e); return; }
  }
}
async function pushProfile(){
  if(!cloud || !currentUser || !userHandle) return;
  const base={ id:currentUser, username:userHandle, display_name:userDisplay,
    xp:S.xp, streak:S.streak, lessons:Object.keys(S.completed).length, updated_at:new Date().toISOString() };
  const full={ ...base, weekly_xp:S.weeklyXp||0, week_start:S.weekKey||weekStartStr() };
  try{
    const {error}=await cloud.from("profiles").upsert(full);
    if(error) throw error;                    // e.g. weekly columns not created yet
  }catch(e){
    try{ await cloud.from("profiles").upsert(base); }   // fall back so core stats still sync
    catch(e2){ console.warn("profile push failed:", e2); }
  }
}
async function loadLeague(){
  const out={ top:[], myRank:null, me:null, error:null, week:weekStartStr() };
  if(!cloud || !currentUser){ out.error="local"; return out; }
  try{
    const {data,error}=await cloud.from("profiles")
      .select("id,username,display_name,weekly_xp,week_start,streak")
      .eq("week_start", out.week).order("weekly_xp",{ascending:false}).limit(50);
    if(error){ out.error=error.message; return out; }
    out.top=(data||[]).filter(p=>(p.weekly_xp||0)>0);
    out.me=out.top.find(p=>p.id===currentUser)||null;
    if(!out.me && (S.weeklyXp||0)>0 && S.weekKey===out.week){
      const {count}=await cloud.from("profiles").select("id",{count:"exact",head:true})
        .eq("week_start",out.week).gt("weekly_xp", S.weeklyXp||0);
      out.myRank=(count||0)+1;
      out.me={ id:currentUser, username:userHandle, display_name:userDisplay, weekly_xp:S.weeklyXp, streak:S.streak };
    }
  }catch(e){ out.error=e.message; }
  return out;
}
async function changeUsername(name){
  const h=sanitizeHandle(name);
  if(h.length<3) return "Username needs at least 3 letters/numbers.";
  if(h===userHandle) return null;
  try{
    const {error}=await cloud.from("profiles").update({ username:h, updated_at:new Date().toISOString() }).eq("id",currentUser);
    if(error){ if(/duplicate|unique|23505/i.test((error.message||"")+(error.code||""))) return "That username is taken."; return error.message; }
    userHandle=h; return null;
  }catch(e){ return e.message; }
}

/* ---- Friends ---- */
async function sendFriendRequest(handle){
  const h=sanitizeHandle(handle);
  if(!h) return "Enter a username.";
  if(h===userHandle) return "That's your own username 🙂";
  try{
    const {data:prof}=await cloud.from("profiles").select("id,username").eq("username",h).maybeSingle();
    if(!prof) return "No user found with that username.";
    const {data:ex}=await cloud.from("friendships").select("id")
      .or(`and(requester.eq.${currentUser},addressee.eq.${prof.id}),and(requester.eq.${prof.id},addressee.eq.${currentUser})`);
    if(ex && ex.length) return "Already friends or a request is pending.";
    const {error}=await cloud.from("friendships").insert({ requester:currentUser, addressee:prof.id, status:"pending" });
    if(error) return error.message;
    return null;
  }catch(e){ return e.message; }
}
async function respondRequest(id, accept){
  try{
    if(accept) await cloud.from("friendships").update({ status:"accepted" }).eq("id",id);
    else await cloud.from("friendships").delete().eq("id",id);
  }catch(e){ console.warn(e); }
}
async function unfriend(id){ try{ await cloud.from("friendships").delete().eq("id",id); }catch(e){ console.warn(e); } }

async function loadSocial(){
  const out={ friends:[], incoming:[], outgoing:[], leaderboard:[], me:null, error:null };
  if(!cloud || !currentUser){ out.error="local"; return out; }
  try{
    const {data:fs, error}=await cloud.from("friendships").select("id,requester,addressee,status")
      .or(`requester.eq.${currentUser},addressee.eq.${currentUser}`);
    if(error){ out.error=error.message; return out; }
    const ids=new Set([currentUser]);
    (fs||[]).forEach(f=>{ ids.add(f.requester); ids.add(f.addressee); });
    const {data:profs, error:pe}=await cloud.from("profiles").select("id,username,display_name,xp,streak,lessons").in("id",[...ids]);
    if(pe){ out.error=pe.message; return out; }
    const pmap={}; (profs||[]).forEach(p=>pmap[p.id]=p);
    out.me = pmap[currentUser] || { id:currentUser, username:userHandle, display_name:userDisplay, xp:S.xp, streak:S.streak };
    const friendProfiles=[];
    (fs||[]).forEach(f=>{
      const other = f.requester===currentUser ? f.addressee : f.requester;
      if(f.status==="accepted"){ const p=pmap[other]; if(p){ friendProfiles.push(p); out.friends.push({fid:f.id, p}); } }
      else if(f.addressee===currentUser){ out.incoming.push({fid:f.id, p:pmap[other]}); }
      else { out.outgoing.push({fid:f.id, p:pmap[other]}); }
    });
    out.leaderboard=[out.me, ...friendProfiles].filter(Boolean).sort((a,b)=>(b.xp||0)-(a.xp||0));
  }catch(e){ out.error=e.message; }
  return out;
}

/* mistakes bank */
function addMistake(id){ if(id && ALL_Q[id] && !S.mistakes.includes(id)) S.mistakes.push(id); }
function removeMistake(id){ const i=S.mistakes.indexOf(id); if(i>=0) S.mistakes.splice(i,1); }
function validMistakes(){ return S.mistakes.filter(id=>ALL_Q[id]); }

/* heart regeneration */
function regenHearts(){
  if(S.hearts>=MAX_HEARTS){ S.lastHeartTs=Date.now(); return; }
  const elapsed = Date.now()-S.lastHeartTs;
  const gained = Math.floor(elapsed/HEART_REFILL_MS);
  if(gained>0){
    S.hearts=Math.min(MAX_HEARTS,S.hearts+gained);
    S.lastHeartTs = S.hearts>=MAX_HEARTS ? Date.now() : S.lastHeartTs+gained*HEART_REFILL_MS;
    save();
  }
}
/* streak tracking */
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function bumpStreak(){
  const t=todayStr();
  if(S.lastPlayDay===t) return;
  const y=new Date(); y.setDate(y.getDate()-1);
  const yStr=y.getFullYear()+"-"+(y.getMonth()+1)+"-"+y.getDate();
  S.streak = (S.lastPlayDay===yStr)? S.streak+1 : 1;
  S.lastPlayDay=t; save();
}

/* Monday-based week key, e.g. "2026-06-29" */
function weekStartStr(){
  const d=new Date(); const off=(d.getDay()+6)%7; d.setDate(d.getDate()-off);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
/* add XP and roll into the weekly-league total (resets on a new week) */
function addXp(n){
  S.xp=(S.xp||0)+n;
  const wk=weekStartStr();
  if(S.weekKey!==wk){ S.weekKey=wk; S.weeklyXp=0; }
  S.weeklyXp=(S.weeklyXp||0)+n;
}
/* every 5 completed exercises grants a bonus heart */
function earnExerciseCredit(){
  S.exProgress=(S.exProgress||0)+1;
  if(S.exProgress>=5){
    S.exProgress=0;
    if(S.hearts<MAX_HEARTS){ S.hearts=Math.min(MAX_HEARTS,S.hearts+1); showToast("🎁 Bonus heart earned! ❤️"); }
    else { showToast("🎁 5 exercises done — hearts already full!"); }
  }
}

/* ============================================================
   Lesson unlocking logic
   A lesson is unlocked if it's the first overall, or the
   previous lesson (in flattened order) is completed.
   ============================================================ */
function flatLessons(){
  const out=[];
  CURRICULUM.forEach((u,ui)=>u.lessons.forEach((l,li)=>out.push({ui,li,key:ui+"-"+li,l,u})));
  return out;
}
function isCompleted(key){ return !!S.completed[key]; }
function isUnlocked(idx, flat){
  if(idx===0) return true;
  return isCompleted(flat[idx-1].key);
}

   ============================================================ */

  let html="";

  let currentKey=null;
  for(let i=0;i<flat.length;i++){ if(isUnlocked(i,flat)&&!isCompleted(flat[i].key)){currentKey=flat[i].key;break;} }

  // ---- Practice / Exercises ----
  const mCount=validMistakes().length;

  html+=`<div class="section-label">Exercises</div>
    <div class="heart-goal"><div class="hg-bar"><i style="width:${(S.exProgress||0)/5*100}%"></i></div>
      <span>🎁 ${S.hearts>=MAX_HEARTS?'Hearts full':exLeft+' more exercise'+(exLeft===1?'':'s')+' → bonus ❤️'}</span></div>

      <div class="pdesc">A quick mixed quiz drawn from every lesson you've unlocked.</div>

      <button class="pbtn" onclick="startPractice('quick')">Start</button>
    </div>
  </div>`;

  CURRICULUM.forEach((u,ui)=>{
    const totalDone=u.lessons.filter((l,li)=>isCompleted(ui+"-"+li)).length;
    html+=`<div class="unit-head" style="background:linear-gradient(135deg, ${u.color}, ${shade(u.color,-18)})">

      html+=`<div class="node-wrap ${off}">

/* small color shader */
function shade(hex,p){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)+p, g=((n>>8)&255)+p, b=(n&255)+p;
  r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b));
  return "#"+((r<<16)|(g<<8)|b).toString(16).padStart(6,"0");
}

/* ============================================================
   Sound FX — synthesized with the Web Audio API (no files).
   Created lazily inside a user gesture to satisfy autoplay rules.
   ============================================================ */
const SOUND_KEY="usdquest_sound";
let soundOn = localStorage.getItem(SOUND_KEY) !== "off";
let actx=null;
function audioCtx(){
  try{
    if(!actx){ const AC=window.AudioContext||window.webkitAudioContext; if(AC) actx=new AC(); }
    if(actx && actx.state==="suspended") actx.resume();
  }catch(e){}
  return actx;
}
function tone(when,freq,dur,type,peak){
  const c=actx; if(!c) return;
  const o=c.createOscillator(), g=c.createGain();
  o.type=type||"sine"; o.frequency.setValueAtTime(freq,when);
  o.connect(g); g.connect(c.destination);
  g.gain.setValueAtTime(0.0001,when);
  g.gain.exponentialRampToValueAtTime(peak||0.22, when+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, when+dur);
  o.start(when); o.stop(when+dur+0.03);
}
function playCorrect(){ const c=audioCtx(); if(!soundOn||!c) return; const t=c.currentTime;
  tone(t,659.25,0.12,"triangle",0.25); tone(t+0.085,987.77,0.20,"triangle",0.25); }   // E5 -> B5
function playWrong(){ const c=audioCtx(); if(!soundOn||!c) return; const t=c.currentTime;
  tone(t,196.0,0.16,"square",0.16); tone(t+0.11,146.83,0.30,"square",0.16); }           // G3 -> D3 buzz
function playComplete(){ const c=audioCtx(); if(!soundOn||!c) return; const t=c.currentTime;
  [523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(t+i*0.12,f,0.22,"triangle",0.24));   // C-E-G-C arpeggio
  tone(t+0.5,1046.5,0.55,"triangle",0.18); tone(t+0.5,1318.5,0.55,"triangle",0.10); }    // final chord
function toggleSound(){
  soundOn=!soundOn;
  localStorage.setItem(SOUND_KEY, soundOn?"on":"off");
  if(soundOn){ audioCtx(); playCorrect(); }   // little confirmation blip
  showToast(soundOn?"Sound on 🔊":"Sound off 🔇");
  if(!el("profile").classList.contains("hidden")) renderProfile();
}

/* ============================================================
   Lesson runtime
   ============================================================ */
let L=null; // current lesson session
function startLesson(ui,li){
  const key=ui+"-"+li;
  const notes=(CURRICULUM[ui].lessons[li].notes)||[];
  if(notes.length && !(S.notesSeen&&S.notesSeen[key])){ showNotes(ui,li,"intro"); return; }
  beginLesson(ui,li);
}
function beginLesson(ui,li){
  regenHearts();
  if(S.hearts<=0){ showToast("Out of hearts! They refill over time ❤️"); renderHome(); return; }
  const unit=CURRICULUM[ui], lesson=unit.lessons[li];
  // shuffle question order each attempt so repeats feel fresh; show up to 10.
  let pool=shuffle(lesson.questions.map(q=>({...q})));
  const qs = pool.slice(0,10);
  L={ui,li,key:ui+"-"+li,lesson,unit,qs,i:0,correct:0,wrong:0,started:Date.now(),selected:null,answered:false};
  hideAllScreens(); hideNav();
  lessonEl.classList.add("active");
  renderQuestion();
}

function startPractice(mode){
  regenHearts();
  let ids=[];
  if(mode==="mistakes"){
    ids=shuffle(validMistakes()).slice(0,15);
    if(!ids.length){ showToast("No mistakes to review 🎉"); renderHome(); return; }
  } else { // quick: random from unlocked lessons
    const flat=flatLessons(), pool=[];
    flat.forEach((f,idx)=>{ if(isUnlocked(idx,flat)) f.l.questions.forEach((q,qi)=>pool.push(f.ui+"-"+f.li+"-"+qi)); });
    ids=shuffle(pool).slice(0,8);
    if(!ids.length){ showToast("Complete a lesson first!"); renderHome(); return; }
  }
  const qs=ids.map(id=>({...ALL_Q[id].q}));   // copy keeps _id
  L={practice:true, practiceMode:mode, qs, i:0, correct:0, wrong:0, started:Date.now(), selected:null, answered:false,
     title: mode==="mistakes" ? "Review Mistakes" : "Quick Practice"};
  hideAllScreens(); hideNav();
  lessonEl.classList.add("active");
  renderQuestion();
}

function renderQuestion(){
  refreshTop();
  L.answered=false; L.selected=null;
  const q=L.qs[L.i];
  pbar.style.width=(L.i/L.qs.length*100)+"%";
  checkBtn.disabled=true; checkBtn.textContent="Check"; checkBtn.className="btn";

  let body=`<div class="q-kind">${q.kind||"Question"}</div><h2 class="q-text">${q.q}</h2>`;
  if(q.sub) body+=`<p class="q-sub">${q.sub}</p>`;
  if(q.code) body+=`<pre class="code">${q.code}</pre>`;

  if(q.type==="mc"){
    // build shuffled choice order, remembering correct index
    const order=shuffle([...q.choices.keys()]);
    q._order=order;
    body+=`<div class="choices">`;
    order.forEach((ci,pos)=>{
      const letter=String.fromCharCode(65+pos);
      body+=`<button class="choice" data-pos="${pos}" onclick="selectChoice(${pos})">
                <span class="key">${letter}</span><span>${q.choices[ci]}</span></button>`;
    });
    body+=`</div>`;
  } else if(q.type==="tf"){
    q._order=[0,1]; // 0=True,1=False
    body+=`<div class="choices">
      <button class="choice" data-pos="0" onclick="selectChoice(0)"><span class="key">T</span><span>True</span></button>
      <button class="choice" data-pos="1" onclick="selectChoice(1)"><span class="key">F</span><span>False</span></button>
    </div>`;
  } else if(q.type==="type"){
    body+=`<input class="typed" id="typedIn" placeholder="Type your answer…" autocomplete="off" autocapitalize="off" spellcheck="false"/>`;
  } else if(q.type==="pairs"){
    L._matched=0; L._selBtns={L:null,R:null};
    const left=shuffle(q.pairs.map((p,idx)=>({idx,txt:p[0]})));
    const right=shuffle(q.pairs.map((p,idx)=>({idx,txt:p[1]})));
    body+=`<div class="pairs"><div class="pcol">`+
      left.map(o=>`<button class="pair" data-side="L" data-idx="${o.idx}" onclick="pairTap(this)">${esc(o.txt)}</button>`).join("")+
      `</div><div class="pcol">`+
      right.map(o=>`<button class="pair" data-side="R" data-idx="${o.idx}" onclick="pairTap(this)">${esc(o.txt)}</button>`).join("")+
      `</div></div>`;
  }
  qbody.innerHTML=body;

  if(q.type==="pairs"){ checkBtn.disabled=true; checkBtn.textContent="Match all the pairs"; }

  if(q.type==="type"){
    const inp=el("typedIn");
    inp.addEventListener("input",()=>{checkBtn.disabled=inp.value.trim()==="";});
    inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&!checkBtn.disabled)onCheck();});
    setTimeout(()=>inp.focus(),60);
  }
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function selectChoice(pos){
  if(L.answered) return;
  L.selected=pos;
  document.querySelectorAll(".choice").forEach(c=>c.classList.toggle("sel",+c.dataset.pos===pos));
  checkBtn.disabled=false;
}

function onCheck(){
  const q=L.qs[L.i];
  if(q.type==="pairs"){ if(L.answered) advance(); return; }
  if(!L.answered){ evaluate(q); }
  else { advance(); }
}

/* match-the-pairs interaction (Duolingo-style tap to match) */
function pairTap(btn){
  if(L.answered || btn.classList.contains("locked")) return;
  const side=btn.dataset.side, sel=L._selBtns;
  if(sel[side]===btn){ btn.classList.remove("sel"); sel[side]=null; return; }
  if(sel[side]) sel[side].classList.remove("sel");
  sel[side]=btn; btn.classList.add("sel");
  if(sel.L && sel.R){
    const a=sel.L, b=sel.R; sel.L=null; sel.R=null;
    if(a.dataset.idx===b.dataset.idx){
      a.classList.remove("sel"); b.classList.remove("sel");
      a.classList.add("locked"); b.classList.add("locked");
      L._matched++;
      const c=audioCtx(); if(soundOn&&c) tone(c.currentTime,880,0.08,"triangle",0.16);
      if(L._matched>=L.qs[L.i].pairs.length) completePairs();
    } else {
      a.classList.add("bad"); b.classList.add("bad");
      setTimeout(()=>{ a.classList.remove("sel","bad"); b.classList.remove("sel","bad"); },450);
    }
  }
}
function completePairs(){
  const q=L.qs[L.i];
  L.answered=true; L.correct++;
  S.answered=(S.answered||0)+1; S.correct=(S.correct||0)+1;
  save(); refreshTop();
  showFeedback(true,q);
}

function evaluate(q){
  L.answered=true;
  let correct=false, userText=null;

  if(q.type==="mc"){
    const chosenOriginal=q._order[L.selected];
    correct = chosenOriginal===q.answer;
    document.querySelectorAll(".choice").forEach(c=>{
      const pos=+c.dataset.pos, orig=q._order[pos];
      c.classList.add("disabled");
      if(orig===q.answer) c.classList.add("correct");
      else if(pos===L.selected) c.classList.add("wrong");
    });
  } else if(q.type==="tf"){
    const chosenBool = L.selected===0; // 0=True
    correct = chosenBool===q.answer;
    document.querySelectorAll(".choice").forEach(c=>{
      const pos=+c.dataset.pos; c.classList.add("disabled");
      const isCorrectBtn = (pos===0)===q.answer;
      if(isCorrectBtn) c.classList.add("correct");
      else if(pos===L.selected) c.classList.add("wrong");
    });
  } else if(q.type==="type"){
    const inp=el("typedIn"); userText=inp.value.trim().toLowerCase();
    inp.disabled=true;
    correct = q.answer.map(a=>a.toLowerCase()).includes(userText);
    inp.style.borderColor = correct? "var(--green)":"var(--red)";
  }

  S.answered=(S.answered||0)+1;
  if(correct){
    L.correct++; S.correct=(S.correct||0)+1;
    if(S.mistakes.includes(q._id)) S.cleared=(S.cleared||0)+1; // re-answered a past mistake
    removeMistake(q._id);
  }
  else{
    L.wrong++; addMistake(q._id);
    if(!L.practice){
      S.hearts=Math.max(0,S.hearts-1);
      if(S.hearts===MAX_HEARTS-1) S.lastHeartTs=Date.now();
    }
  }
  save();
  refreshTop();
  showFeedback(correct,q);
}

function showFeedback(correct,q){
  if(correct) playCorrect(); else playWrong();
  feedback.className="feedback "+(correct?"ok":"no")+" show";
  fbTitle.innerHTML = correct? "✅ Correct!" : ((!L.practice && S.hearts<=0)?"💔 Out of hearts":"❌ Not quite");
  fbExplain.innerHTML=q.explain||"";
  checkBtn.className="btn "+(correct?"":"blue");
  checkBtn.textContent="Continue";
  checkBtn.disabled=false;
}

function advance(){
  feedback.classList.remove("show");
  if(!L.practice && S.hearts<=0){ // failed lesson
    setTimeout(()=>endLesson(false),250);
    return;
  }
  L.i++;
  if(L.i>=L.qs.length){ setTimeout(()=>endLesson(true),250); return; }
  setTimeout(renderQuestion,180);
}

function endLesson(passed){
  feedback.classList.remove("show");
  lessonEl.classList.remove("active");
  checkBtn.className="btn"; checkBtn.textContent="Check";
  const total=L.qs.length;
  const acc=Math.round(L.correct/total*100);
  const secs=Math.round((Date.now()-L.started)/1000);
  let gainedXp=0;

  if(L.practice){
    bumpStreak();
    gainedXp=5+L.correct*2;
    addXp(gainedXp); earnExerciseCredit(); save(); refreshTop();
    resultsEl.classList.add("active");
    playComplete();
    const remaining=validMistakes().length;
    const third = L.practiceMode==="mistakes"
      ? `<div class="rstat time"><div class="v">${remaining}</div><div class="l">Mistakes left</div></div>`
      : `<div class="rstat time"><div class="v">${secs}s</div><div class="l">Time</div></div>`;
    resultsEl.innerHTML=`
      <div class="big">${L.wrong===0?"🌟":"💪"}</div>
      <h1>Practice complete!</h1>
      <p>${L.title}</p>
      <div class="rstats">
        <div class="rstat xp"><div class="v">+${gainedXp}</div><div class="l">XP</div></div>
        <div class="rstat acc"><div class="v">${L.correct}/${total}</div><div class="l">Correct</div></div>
        ${third}
      </div>
      <div style="width:100%;max-width:340px"><button class="btn" onclick="renderHome()">Continue</button></div>`;
    return;
  }

  if(passed){
    bumpStreak();
    const base=10, bonus=L.wrong===0?5:0;
    gainedXp=base+bonus+L.correct*2;
    addXp(gainedXp); earnExerciseCredit();
    const prevBest=(S.completed[L.key]&&S.completed[L.key].best)||0;
    S.completed[L.key]={best:Math.max(prevBest,acc)};
    save();
  }
  refreshTop();

  resultsEl.classList.add("active");
  if(passed){
    playComplete();
    const perfect=L.wrong===0;
    resultsEl.innerHTML=`
      <div class="big">${perfect?"🏆":"🎉"}</div>
      <h1>${perfect?"Flawless!":"Lesson complete!"}</h1>
      <p>${L.unit.title} · ${L.lesson.name}</p>
      <div class="rstats">
        <div class="rstat xp"><div class="v">+${gainedXp}</div><div class="l">Total XP</div></div>
        <div class="rstat acc"><div class="v">${acc}%</div><div class="l">Accuracy</div></div>
        <div class="rstat time"><div class="v">${secs}s</div><div class="l">Time</div></div>
      </div>
      <div style="width:100%;max-width:340px">
        <button class="btn" onclick="renderHome()">Continue</button>
      </div>`;
  } else {
    resultsEl.innerHTML=`
      <div class="big">💔</div>
      <h1>Out of hearts</h1>
      <p>You ran out on <b>${L.lesson.name}</b>. Hearts refill over time — or try again now.</p>
      <div class="rstats">
        <div class="rstat acc"><div class="v">${L.correct}/${total}</div><div class="l">Correct</div></div>
        <div class="rstat time"><div class="v">${S.hearts}</div><div class="l">Hearts left</div></div>
      </div>
      <div style="width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px">
        <button class="btn" onclick="renderHome()">Back to path</button>
      </div>`;
  }
}

// keyboard: number keys pick choices, Enter checks

  if(!lessonEl.classList.contains("active")) return;
  if(L&&!L.answered){
    const q=L.qs[L.i];
    if(q.type==="mc"||q.type==="tf"){
      const n=parseInt(e.key);
      const count=q.type==="tf"?2:q.choices.length;
      if(n>=1&&n<=count){ selectChoice(n-1); }
      if((e.key==="t"||e.key==="T")&&q.type==="tf") selectChoice(0);
      if((e.key==="f"||e.key==="F")&&q.type==="tf") selectChoice(1);
    }
  }
  if(e.key==="Enter"&&!checkBtn.disabled){ e.preventDefault(); onCheck(); }
});

/* ---- Export / Import progress backup ---- */
function exportProgress(){
  const payload={ app:"usdquest", version:1, exportedAt:new Date().toISOString(), state:S };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  const d=new Date(), pad=n=>String(n).padStart(2,"0");
  a.href=url;
  a.download=`usdquest-progress-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  showToast("Backup downloaded ⬇");
}
function importProgress(file){
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      // accept either the wrapped payload or a raw state object
      const incoming = (data && data.app==="usdquest" && data.state) ? data.state : data;
      if(!incoming || typeof incoming!=="object" || typeof incoming.xp==="undefined" || typeof incoming.completed==="undefined")
        throw new Error("Not a USDQuest backup file");
      if(!confirm("Replace your current progress with this backup?")) return;
      S={...defaultState(), ...incoming};
      // guard the numbers
      S.hearts=Math.max(0,Math.min(MAX_HEARTS, +S.hearts||0));
      S.xp=Math.max(0,+S.xp||0);
      S.streak=Math.max(0,+S.streak||0);
      if(typeof S.completed!=="object"||!S.completed) S.completed={};
      save(); renderHome(); showToast("Progress restored ✅");
    }catch(e){ alert("Couldn't import that file.\n\n"+e.message); }
  };
  reader.onerror=()=>alert("Couldn't read that file.");
  reader.readAsText(file);
}
el("importFile").addEventListener("change",e=>{
  const f=e.target.files[0]; if(f) importProgress(f);
  e.target.value=""; // allow re-importing the same file later
});

/* Global leaderboard: top profiles by XP, plus my rank if I'm off the list */
async function loadGlobal(){
  const out={ top:[], myRank:null, me:null, error:null };
  if(!cloud || !currentUser){ out.error="local"; return out; }
  try{
    const {data,error}=await cloud.from("profiles")
      .select("id,username,display_name,xp,streak,lessons")
      .order("xp",{ascending:false}).order("updated_at",{ascending:true}).limit(50);
    if(error){ out.error=error.message; return out; }
    out.top=data||[];
    out.me=out.top.find(p=>p.id===currentUser)||null;
    if(!out.me){
      const mine=await cloud.from("profiles").select("id,username,display_name,xp,streak").eq("id",currentUser).maybeSingle();
      out.me=(mine.data)||{ id:currentUser, username:userHandle, display_name:userDisplay, xp:S.xp, streak:S.streak };
      const {count}=await cloud.from("profiles").select("id",{count:"exact",head:true}).gt("xp", out.me.xp||0);
      out.myRank=(count||0)+1;
    }
  }catch(e){ out.error=e.message; }
  return out;
}

  const tile=(ic,v,l)=>`<div class="ptile"><div class="pv">${v}</div><div class="pl">${ic} ${l}</div></div>`;

  let html=`<div class="profile-head">
      <div class="avatar">${esc((userDisplay||'U').slice(0,1).toUpperCase())}</div>
      <div><h2>${esc(userDisplay||'Learner')}</h2><p>${cloud?('@'+esc(userHandle||'…')):'local account'}</p></div>
    </div>`;
  html+=`<div class="stat-grid">
      ${tile('⚡',S.xp,'Total XP')}
      ${tile('🔥',S.streak,'Streak')}
      ${tile('✅',done+'/'+totalLessons,'Lessons')}
      ${tile('🎯',acc+'%','Accuracy')}
      ${tile('🩹',validMistakes().length,'To review')}
      ${tile('💪',S.cleared||0,'Cleared')}
    </div>`;

  html+=`<div class="section-label">Progress by unit</div>`;
  CURRICULUM.forEach((u,ui)=>{
    const tot=u.lessons.length;
    const dn=u.lessons.filter((l,li)=>isCompleted(ui+"-"+li)).length;
    const pct=Math.round(dn/tot*100);
    html+=`<div class="uprog"><div class="uprog-top"><span>${esc(u.title)}</span><span>${dn}/${tot}</span></div>
      <div class="ubar"><i style="width:${pct}%;background:${u.color}"></i></div></div>`;
  });

  html+=`<div class="section-label">Account</div>`;
  if(cloud){
    html+=`<div class="addfriend"><input id="unameInput" value="${esc(userHandle||'')}" autocapitalize="off" spellcheck="false" placeholder="username"/>
      <button class="mini add" onclick="saveUsername()">Save</button></div>
      <div id="unameMsg" class="auth-msg" style="text-align:left;min-height:16px"></div>`;
  }
  html+=`<div class="acct-actions">
      <button class="reset" onclick="toggleSound()">${soundOn?'🔊 Sound: On':'🔇 Sound: Off'}</button>
      <button class="reset" onclick="exportProgress()">⬇ Export backup</button>
      <button class="reset" onclick="document.getElementById('importFile').click()">⬆ Import backup</button>
      <button class="reset" onclick="hardReset()">↺ Reset progress</button>
      <button class="reset danger" onclick="logoutConfirm()">⎋ Log out</button>
    </div>`;
  el("profile").innerHTML=html;
}
async function saveUsername(){
  const m=el("unameMsg"); m.className="auth-msg"; m.textContent="Saving…";
  const err=await changeUsername(el("unameInput").value);
  if(err){ m.textContent=err; m.className="auth-msg"; return; }
  m.textContent="Saved!"; m.className="auth-msg ok"; refreshTop();
}
function logoutConfirm(){ if(confirm("Log out? Your progress is saved to this account.")) logout(); }

window.startLesson=startLesson; window.startPractice=startPractice; window.selectChoice=selectChoice;
window.renderHome=renderHome; window.renderSocial=renderSocial; window.renderProfile=renderProfile;
window.hardReset=hardReset; window.exportProgress=exportProgress;
window.addFriend=addFriend; window.acceptReq=acceptReq; window.declineReq=declineReq; window.removeFriend=removeFriend;
window.saveUsername=saveUsername; window.logoutConfirm=logoutConfirm; window.toggleSound=toggleSound;
window.renderStudy=renderStudy; window.showNotes=showNotes; window.pairTap=pairTap;

/* boot — resume session if logged in, else show login */
async function boot(){
  if(cloud){
    // adapt the login UI for email-based cloud auth
    const lab=document.querySelector('label[for="authUser"]'); if(lab) lab.textContent="Email";
    el("authUser").type="email"; el("authUser").placeholder="you@example.com";
    el("authUser").setAttribute("autocomplete","email");
    const tag=document.querySelector(".login .tag");
    if(tag) tag.innerHTML="Master NVIDIA OpenUSD — on any device.<br>Your progress syncs to the cloud with your account.";
    const note=document.querySelector(".login .note");
    if(note) note.innerHTML="☁️ Progress is saved to your account in the cloud — log in with the same email on your phone to pick up where you left off.";
    try{
      const {data}=await cloud.auth.getSession();
      if(data && data.session){ await onCloudSignedIn(data.session.user); hideLogin(); renderHome(); return; }
    }catch(e){ console.warn("Session check failed:", e); }
    showLogin();
  } else {
    if(currentUser && accounts[currentUser]){ loginOk(currentUser); hideLogin(); renderHome(); }
    else { currentUser=null; showLogin(); }
  }
}
boot();
</script>
